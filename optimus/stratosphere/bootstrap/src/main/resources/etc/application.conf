// Defaults for StratosphereConfig.
//
// StratosphereConfig layers etc/{no-,}workspace.conf, etc/<platform>.conf and
// etc/application.conf underneath the workspace's own stratosphere.conf. Those
// resources ship inside the internal stratosphere distribution and are not part
// of the open-source tree, which leaves the workspace-less config
// (StratoWorkspace(NoWorkspace), used by BaseConfigs.defaultConfig) completely
// empty -- and the constructor then throws on the first key it reads.
//
// These are fallbacks only: anything the workspace's stratosphere.conf sets wins.

stratosphereVersion = "0.0.0-oss"
stratosphereHome = ""
stratosphereWorkspace = ""

javaVersion = "21.0.5"

internal {
  java {
    install = ""
  }
  stratosphere {
    // resolveSymlinkVersion() substitutes {version} in here and follows the result if it
    // exists, falling back to stratosphereVersion otherwise. There is no infra install to
    // point at outside Morgan Stanley, so name a path that will not resolve.
    infra-path = "/nonexistent/stratosphere/{version}"
  }
  train {
    enabled = false
  }
  paths {
    migration-config = ""
    proid-homes = []
  }
  scala {
    release-location = ""
    nightly-location = ""
  }
  files {
    idea-executable = ""
    idea-server-executable = ""
    idea-script = ""
    fs-notifier-executable = ""
    vm-options-properties = ""
  }
  console {
    use-colors = true
    colors {
      error = RED
      warning = YELLOW
      highlight = GREEN
    }
  }
  jfrog {
    home = ""
    config-file = ""
  }
  pypi {
    home = ""
    config-file = ""
    uv-config-file = ""
  }
  // Deliberately no 'channels' block: channels are a workspace concept, and
  // StratosphereChannelsConfig.selectAllChannels returns no channels when the
  // list key is absent. Defining an empty list here instead would take that
  // short-circuit away and require a userName default too.
}

// IntellijDirectoryStructure reads these eagerly when a StratoWorkspace is built,
// even though OBT never uses the IDE paths.
intellij {
  version = ""
  ultimate = false
  // RemoteIntellijLocation takes these as Configs; its members read root/community/
  // ultimate/linuxExt/winExt lazily, so the objects just have to exist.
  location {
    afs { root = "", community = "", ultimate = "", linuxExt = "", winExt = "" }
    artifactory { root = "", community = "", ultimate = "", linuxExt = "", winExt = "" }
  }
}
