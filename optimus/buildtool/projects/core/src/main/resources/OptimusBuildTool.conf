// StaticConfig reads this resource. It ships with the internal OBT distribution and is not
// part of the open-source tree, which leaves every lookup empty.
//
// StaticConfig.string returns "" for a missing key, so only the sequences that get indexed
// need values here. DomainGenerator reads three elements out of each of these to build an
// AfsExecutable; there is no AFS to resolve them against outside Morgan Stanley, so they are
// placeholders that keep construction from throwing. The generator only runs for scopes with
// xml templates, of which this workspace has none.
domainGeneratorLinuxAfsExecutable = ["unset", "unset", "unset"]
domainGeneratorWindowsAfsExecutable = ["unset", "unset", "unset"]
