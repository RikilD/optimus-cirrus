userName = ${USER}
scalaVersion = 2.13.18
# Exported as SCALA_HOME when OBT compiles .runconf files. Points at the scala
# boot directory sbt populates on its first run; its lib/ holds scala-library.jar,
# scala-compiler.jar and scala-reflect.jar.
scalaHomePath = ${HOME}"/.sbt/boot/scala-"${scalaVersion}"/"
javaVersion = 21.0.5
stratosphereVersion = X
obt-version = X
obt {
  testplans { 
    enableTestCaching = false
    enableScopedTests = false
  }
}
internal { 
  stratosphere {
    infra-path = X
  }
  paths {
    migration-config = X
    proid-homes = []
  }
  java {
    install = X
  }
  scala {
    release-location = X
    nightly-location = X
  }
  files { 
    idea-executable = X
    idea-server-executable = X
    idea-script = X
    fs-notifier-executable = X
    vm-options-properties = X
  }
  console {
    use-colors = true
    colors {
      error = RED
      warning = YELLOW
      highlight = GREEN
    } 
  } 
  jfrog {
    home = X
    config-file = X
  }
  pypi {
    home = X
    config-file = X
    uv-config-file = X
  }
}
intellij {
  version = X
  location { 
    afs { 
      root = X
      community = X
      ultimate = X
      linuxExt = X
      windowsExt = X
    }
    artifactory { 
      root = X
      community = X
      ultimate = X
      linuxExt = X
      windowsExt = X
    }
  }
  ultimate = false
  jar-repo-file = X
}
